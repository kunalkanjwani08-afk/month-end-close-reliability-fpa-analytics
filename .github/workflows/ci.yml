name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast checks that need no data: syntax, imports and the 42 fixture tests.
  fixture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - name: Fixture tests (no real data)
        run: python -m pytest tests/test_sql_pipeline_units.py -q
        env:
          ALLOW_SKIPPED_FULLDATA_TESTS: "1"

  # End-to-end: regenerate the cleaned data from the raw file, run the SQL pipeline and the full-data tests.
  # The Excel workbook tests need LibreOffice and are not part of this job.
  full-data-reproduction:
    runs-on: ubuntu-latest
    needs: fixture-tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decompress the raw dataset
        run: gunzip -k data/raw/fpa_monthly_close_raw_messy.csv.gz
      - name: Regenerate the cleaned dataset (cleaner checks the raw file's SHA-256 first)
        run: python src/clean_fpa_monthly_close.py --output-dir data/processed --no-excel-readback
      - name: TEMP diagnostic - raw byte profile
        if: always()
        run: |
          python - <<'PY'
          import hashlib
          b = open("data/processed/fpa_monthly_close_cleaned.csv", "rb").read()
          first = b.split(b"\n", 1)[0]
          print("::error::BYTES size=" + str(len(b)) + " cr=" + str(b.count(b"\r")) + " lf=" + str(b.count(b"\n")) + " quote=" + str(b.count(b'"')) + " comma=" + str(b.count(b",")) + " bom=" + str(b[:3] == b"\xef\xbb\xbf") + " sha_nocr=" + hashlib.sha256(b.replace(b"\r", b"")).hexdigest()[:12] + " sha=" + hashlib.sha256(b).hexdigest()[:12] + " hdr_sha=" + hashlib.sha256(first).hexdigest()[:12])
          PY
      - name: SQL analysis pipeline (fails unless every validation check passes)
        run: |
          set +e
          python src/sql_analysis_pipeline.py 2> sql_stderr.txt
          rc=$?
          cat sql_stderr.txt >&2
          if [ $rc -ne 0 ]; then
            # surface the failing validation rows as annotations so they are visible without opening the log
            head -n 25 sql_stderr.txt | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit $rc
      - name: Full-data tests (all except the Excel workbook tests)
        run: python -m pytest tests -q --ignore=tests/test_excel_workbook.py --ignore=tests/dashboard_browser_qa.py --ignore=tests/dashboard_negative_controls.py
