name: diag-csv
on:
  push:
    branches: [diag-csv]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements.txt
      - run: gunzip -k data/raw/fpa_monthly_close_raw_messy.csv.gz
      - run: python src/clean_fpa_monthly_close.py --output-dir data/processed --no-excel-readback
      - name: Column-level comparison with reference
        run: |
          python - <<'PY'
          import json, hashlib, numpy as np, pandas as pd
          d = pd.read_csv("data/processed/fpa_monthly_close_cleaned.csv", dtype=str, keep_default_na=False, encoding="utf-8-sig")
          ref_h = json.load(open(".diag_hash.json")); fl = json.load(open(".diag_cols.json")); ref = np.load(".diag_floats.npy")
          diff_cols = [c for c in d.columns if hashlib.sha256("\x1f".join(d[c].tolist()).encode()).hexdigest()[:10] != ref_h[c]]
          print("::warning::DIFFCOLS " + str(len(diff_cols)) + " " + ",".join(diff_cols))
          print("::warning::NONFLOAT_DIFF " + ",".join(c for c in diff_cols if c not in fl))
          out = []
          for j, c in enumerate(fl):
              ci = pd.to_numeric(d[c].replace("", np.nan), errors="coerce").to_numpy(float)
              r = ref[:, j]
              nan_mismatch = int((np.isnan(ci) != np.isnan(r)).sum())
              m = ~np.isnan(ci) & ~np.isnan(r)
              ne = m & (ci != r)
              ulp = np.abs(ci[ne] - r[ne]) / np.spacing(np.abs(r[ne])) if ne.any() else np.array([0.0])
              rel = np.abs(ci[ne] - r[ne]) / np.abs(r[ne]) if ne.any() else np.array([0.0])
              out.append(c + ":cells_diff=" + str(int(ne.sum())) + ",nan_mismatch=" + str(nan_mismatch) + ",max_ulp=" + format(float(np.nanmax(ulp)), ".1f") + ",max_rel=" + format(float(np.nanmax(rel)), ".2e"))
          print("::warning::FLOATS " + " | ".join(out))
          print("::notice::MATRIX ${{ matrix.n }}")
          PY
